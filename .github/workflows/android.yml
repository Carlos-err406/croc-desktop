name: Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast signal: does the crate compile for Android? Needs no SDK/NDK, because
  # nothing in the Android dependency set has a C build script — that's exactly why
  # reqwest and the updater are desktop-only (their rustls path pulls in `ring`).
  check:
    name: cargo check (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-check

      - run: npm ci

      - name: Check Rust for Android
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android

  # Builds an installable debug APK. Debug rather than release so this needs no
  # signing secrets: the point is an artifact you can sideload and test.
  # (debugApplicationIdSuffix means it installs alongside a release build.)
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # croc is compiled from source for GOOS=android: the published Linux binaries
      # are non-PIE, and Android has refused non-PIE executables since API 21. CGO
      # stays off, so no NDK toolchain is involved in croc's own build.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-apk

      - name: Point NDK_HOME at the runner's NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "using NDK: $ndk"

      - run: npm ci

      # Generates src-tauri/gen/android. Deliberately not committed: it's template
      # output, and regenerating picks up Tauri's own fixes.
      - name: Generate the Android project
        run: npm run tauri -- android init

      # Our deltas on top of that template: the CROC_BIN hook, jniLibs packaging,
      # arm64 ABI filter, permissions, deep links and the share target.
      - name: Apply Android configuration
        run: node scripts/android-configure.mjs

      - name: Build APK
        run: npm run tauri -- android build --debug --apk --target aarch64

      - name: Locate and sanity-check the APK
        id: apk
        run: |
          apk=$(find src-tauri/gen/android -name '*.apk' | head -1)
          test -n "$apk" || { echo "no APK produced"; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"
          # An APK that installs but can't transfer is the failure mode to catch here:
          # confirm croc is packaged, for the right architecture.
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/libcroc\.so' \
            || { echo "libcroc.so missing from APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: croc-android-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
