name: Release

on:
  push:
    tags:
      - 'v*' # e.g. v0.2.0 — must match the version in tauri.conf.json / package.json
  workflow_dispatch: {} # manual runs build only (validate packaging; no publish)

permissions:
  contents: write # create/upload the draft GitHub Release

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds a universal binary (Intel + Apple Silicon in one).
          - os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
          # 22.04 for broader glibc compatibility of the AppImage.
          - os: ubuntu-22.04
            rust-targets: ''
            args: ''
          - os: windows-latest
            rust-targets: ''
            args: ''

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Faster linker on Linux (mold becomes the default ld); no-op on mac/windows.
      # Non-fatal: a transient mold-download blip must not fail the release — the
      # build just falls back to the default linker.
      - name: Set up mold linker (Linux)
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        uses: rui314/setup-mold@v1

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      # Cache the bundled croc download; beforeBuildCommand's fetch-croc.mjs then
      # skips re-downloading when the cache hits.
      - name: Cache croc sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: croc-${{ runner.os }}-${{ hashFiles('scripts/fetch-croc.mjs') }}

      # tauri-action runs the frontend build (beforeBuildCommand), compiles the
      # Rust, bundles per-platform installers, and — on a tag push — uploads them
      # to a draft GitHub Release. On manual dispatch (no tag) it just builds.
      - name: Build (+ publish on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts + latest.json so installed apps trust them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # One release carries every platform now, including the Android APK.
          releaseName: 'Croc __VERSION__'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # The Android APK rides in the same GitHub release as the desktop artifacts.
  # Separate job: tauri-action drives the desktop bundlers and has no Android path,
  # and Android needs a JDK, the NDK and a Go toolchain that the desktop jobs don't.
  android:
    name: Android APK
    runs-on: ubuntu-latest
    # Only on a tag — this uploads to the release that the tag created.
    if: github.ref_type == 'tag'
    needs: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # croc is compiled for GOOS=android: the published Linux binaries are non-PIE
      # and Android has refused those since API 21. CGO stays off, so the NDK isn't
      # involved in croc's own build.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-release

      - name: Point NDK_HOME at the runner's NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Generate the Android project
        run: npm run tauri -- android init

      - name: Apply Android configuration
        run: node scripts/android-configure.mjs

      # Absent secrets produce an UNSIGNED apk, which Android refuses to install, so
      # fail loudly here rather than publishing something nobody can use.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the APK would be unsigned and uninstallable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/release.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build the signed APK
        run: npm run tauri -- android build --apk --target aarch64

      - name: Name it after the release and sanity-check it
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          src=$(find src-tauri/gen/android -name '*-release*.apk' ! -name '*unsigned*' | head -1)
          test -n "$src" || { echo "::error::no signed APK produced"; exit 1; }
          # croc missing means an APK that installs and then cannot transfer.
          unzip -l "$src" | grep -q 'lib/arm64-v8a/libcroc\.so' \
            || { echo "::error::libcroc.so missing from the APK"; exit 1; }
          out="croc-mobile-${version}-arm64.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - name: Attach it to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber

      # Keep the key material out of the runner's workspace even on a cached runner.
      - name: Shred the keystore
        if: always()
        run: rm -f src-tauri/gen/android/release.jks src-tauri/gen/android/keystore.properties
