name: Release

on:
  push:
    tags:
      - 'v*' # e.g. v0.2.0 — must match the version in tauri.conf.json / package.json
  # Manual runs build only — they never publish (see the `if:`s below). Worth doing
  # before you tag, for two reasons: it rehearses the packaging, and because a non-tag
  # run is the only one that *saves* the Rust cache (see `save-if`), it leaves
  # main-scoped caches that the tag run can then restore. Verified: a dispatch from main
  # wrote v0-rust-release-{Darwin,Linux,Windows_NT}-* under refs/heads/main, and tag runs
  # can read default-branch caches. So: dispatch once after a dependency change, then tag.
  workflow_dispatch: {}

permissions:
  contents: write # create/upload the draft GitHub Release

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds a universal binary (Intel + Apple Silicon in one).
          - os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
          # 22.04 for broader glibc compatibility of the AppImage.
          - os: ubuntu-22.04
            rust-targets: ''
            args: ''
          - os: windows-latest
            rust-targets: ''
            args: ''

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Faster linker on Linux (mold becomes the default ld); no-op on mac/windows.
      # Non-fatal: a transient mold-download blip must not fail the release — the
      # build just falls back to the default linker.
      - name: Set up mold linker (Linux)
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        uses: rui314/setup-mold@v1

      # Restore-only on a tag. A cache saved from refs/tags/vX is readable only by that
      # same tag's runs, so saving here was pure dead work — and it's the last step of
      # the job, so it delayed the very leg that gates the release (39-50s on mac/win).
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Install Tauri system deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      # Cache the bundled croc download; beforeBuildCommand's fetch-croc.mjs then
      # skips re-downloading when the cache hits.
      - name: Cache croc sidecar
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: croc-${{ runner.os }}-${{ hashFiles('scripts/fetch-croc.mjs') }}

      # tauri-action runs the frontend build (beforeBuildCommand), compiles the
      # Rust, bundles per-platform installers, and — on a tag push — uploads them
      # to a draft GitHub Release. On manual dispatch (no tag) it just builds.
      - name: Build (+ publish on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts + latest.json so installed apps trust them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # One release carries every platform now, including the Android APK.
          releaseName: 'Croc __VERSION__'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # The Android APK rides in the same GitHub release as the desktop artifacts.
  # Separate job: tauri-action drives the desktop bundlers and has no Android path,
  # and Android needs a JDK, the NDK and a Go toolchain that the desktop jobs don't.
  #
  # Deliberately NOT `needs: release`. It used to be, so ~10 minutes of Android build
  # started only once the whole desktop matrix had finished — that single edge was half
  # the release's wall clock (22m vs the 10m the releases took before this job existed).
  # It now builds alongside the desktop legs and hands the APK to `attach-apk` below,
  # which waits for the release that tauri-action creates. Polling for that release from
  # here instead would be a coin flip: the measured margin has been as small as 6s.
  android:
    name: Android APK
    runs-on: ubuntu-latest
    # Runs on a manual dispatch too, so the Android half of a release can be rehearsed
    # without cutting a tag — publishing is gated in attach-apk, not here. (It used to
    # test `github.ref_type == 'tag'`, which is also true for a dispatch *from* a tag,
    # so a supposedly build-only run would have published an APK.)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # croc is compiled for GOOS=android: the published Linux binaries are non-PIE
      # and Android has refused those since API 21. CGO stays off, so the NDK isn't
      # involved in croc's own build.
      # go-version must stay >= croc's own go directive; v7 sets GOTOOLCHAIN=local, so a
      # too-old pin fails the build instead of quietly fetching a toolchain. See android.yml.
      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # Keys off go.sum, which this repo doesn't have — see android.yml.
          cache: false

      # Exact patch in the key — see android.yml for why 1.25 alone rots silently.
      - name: Cache the Go module + build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: gocroc-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/fetch-croc.mjs') }}
          restore-keys: gocroc-${{ runner.os }}-

      # See android.yml — Gradle otherwise re-downloads its distribution every run.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-release
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Point NDK_HOME at the runner's NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - run: npm ci

      # --skip-targets-install: see android.yml.
      - name: Generate the Android project
        run: npm run tauri -- android init --skip-targets-install

      - name: Apply Android configuration
        run: node scripts/android-configure.mjs

      # Absent secrets produce an UNSIGNED apk, which Android refuses to install, so
      # fail loudly here rather than publishing something nobody can use.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the APK would be unsigned and uninstallable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/release.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build the signed APK
        run: npm run tauri -- android build --apk --target aarch64

      - name: Name it after the release and sanity-check it
        id: apk
        run: |
          # On a dispatch GITHUB_REF_NAME is a branch, which would name the APK
          # "croc-mobile-main-arm64.apk"; fall back to the version the app declares.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p "require('./package.json').version")
          fi
          src=$(find src-tauri/gen/android -name '*-release*.apk' ! -name '*unsigned*' | head -1)
          test -n "$src" || { echo "::error::no signed APK produced"; exit 1; }
          # croc missing means an APK that installs and then cannot transfer.
          unzip -l "$src" | grep -q 'lib/arm64-v8a/libcroc\.so' \
            || { echo "::error::libcroc.so missing from the APK"; exit 1; }
          out="croc-mobile-${version}-arm64.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      # Hand the APK to attach-apk rather than uploading from here: this job now runs in
      # parallel with the desktop matrix, so the release may not exist yet.
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          overwrite: true # artifacts are immutable; a re-run 409s without this
          retention-days: 1 # a release-signed APK on a public repo — don't keep it 90 days

      # Keep the key material out of the runner's workspace even on a cached runner.
      - name: Shred the keystore
        if: always()
        run: rm -f src-tauri/gen/android/release.jks src-tauri/gen/android/keystore.properties

  # Attaching is split out so the Android build doesn't have to wait for the desktop
  # matrix — only this ~20s job does. tauri-action stays the only thing that creates the
  # release; `gh release upload` cannot, so one-release-per-tag is structural.
  attach-apk:
    name: Attach the APK to the release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [release, android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: apk

      - name: Upload it to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(ls apk/croc-mobile-*-arm64.apk)
          # -R is load-bearing: this job has no checkout, so gh can't infer the repo.
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber -R "$GITHUB_REPOSITORY"

      # All three desktop legs merge their own platform into latest.json and re-upload
      # it; in the v2.6.0 run two of those writes landed 7s apart. A lost merge means
      # installed apps on that platform silently never see the update, so check the
      # published manifest actually carries every platform before we call it a release.
      - name: Verify the updater manifest carries every platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p latest.json --clobber
          for p in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].url' latest.json >/dev/null \
              || { echo "::error::latest.json is missing $p — tauri-action's merge lost a platform"; exit 1; }
          done
          echo "latest.json carries all four platforms."
