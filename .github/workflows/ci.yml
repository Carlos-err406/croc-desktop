name: CI

on:
  push:
    branches: [main, tauri-rewrite]
    # Nothing here reads markdown: *.md is in .prettierignore, eslint only walks
    # ts/tsx, and no source file loads a doc. A docs-only push has nothing to check.
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + frontend + Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # dtolnay/rust-toolchain installs the minimal profile, which omits both.
          components: rustfmt, clippy

      # Faster linker for the Tauri crate graph (mold becomes the default ld).
      - name: Set up mold linker
        continue-on-error: true
        uses: rui314/setup-mold@v1

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # System libraries Tauri's Rust crates link against on Linux.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Cheap checks first — these need no croc sidecar and no Rust build.
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build:vite

      # The Rust check triggers Tauri's externalBin validation, which needs the croc
      # sidecar present. (tauri-action does this via beforeBuildCommand; here we run
      # it explicitly.) Cache the download so it isn't re-fetched every run.
      - name: Cache croc sidecar
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: croc-${{ runner.os }}-${{ hashFiles('scripts/fetch-croc.mjs') }}

      - name: Fetch croc sidecar
        run: node scripts/fetch-croc.mjs

      # Clippy compiles the crate anyway, so this replaces a plain `cargo check` at no
      # extra cost. If a new stable toolchain adds a lint, that shows up as a red PR
      # unrelated to the change — fix it or `#[allow]` it with a reason.
      - name: Check Rust (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
